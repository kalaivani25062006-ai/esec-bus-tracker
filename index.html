
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESEC Bus GPS Tracker</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f6fd;
  color: #17365c;
  padding: 20px;
  margin: 0;
}
.card {
  background: white;
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 16px #0001;
}
h2 { color: #176bd1; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}
.start { background: #16834b; color: white; }
.stop { background: #e5485d; color: white; }
.map { background: #e5f0ff; color: #1456a0; }
.info {
  background: #f1f6fd;
  padding: 12px;
  border-radius: 9px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
a { color: #176bd1; }
</style>
</head>

<body>
<div class="card">
  <h2>🚌 ESEC Bus GPS Tracker</h2>
  <p>Mobile Location Tracking</p>

  <div class="info">
    <b>Status:</b>
    <span id="status">Not started</span>
  </div>

  <div class="info">
    <b>Latitude:</b>
    <span id="lat">--</span>
  </div>

  <div class="info">
    <b>Longitude:</b>
    <span id="lon">--</span>
  </div>

  <div class="info">
    <b>Accuracy:</b>
    <span id="accuracy">--</span>
  </div>

  <button class="start" onclick="startGPS()">
    START LOCATION
  </button>

  <button class="stop" onclick="stopGPS()">
    STOP LOCATION
  </button>

  <button class="map" onclick="openMap()">
    VIEW LOCATION ON MAP
  </button>

  <p id="message">Press START LOCATION and allow permission.</p>
</div>

<script>
let watchId = null;
let currentLat = null;
let currentLon = null;

function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById("message").textContent =
      "Geolocation is not supported by this browser.";
    return;
  }

  if (watchId !== null) return;

  document.getElementById("status").textContent =
    "Searching for location...";

  document.getElementById("message").textContent =
    "Please allow location permission.";

  watchId = navigator.geolocation.watchPosition(
    function(position) {
      currentLat = position.coords.latitude;
      currentLon = position.coords.longitude;

      document.getElementById("status").textContent =
        "LOCATION ACTIVE";

      document.getElementById("lat").textContent =
        currentLat.toFixed(6);

      document.getElementById("lon").textContent =
        currentLon.toFixed(6);

      document.getElementById("accuracy").textContent =
        Math.round(position.coords.accuracy) + " metres";

      document.getElementById("message").textContent =
        "Location updated: " +
        new Date().toLocaleTimeString();
    },
    function(error) {
      document.getElementById("status").textContent =
        "Location unavailable";

      document.getElementById("message").textContent =
        error.message +
        ". Check phone Location settings and browser permission.";

      watchId = null;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    }
  );
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.getElementById("status").textContent =
    "Location stopped";

  document.getElementById("message").textContent =
    "GPS tracking stopped.";
}

function openMap() {
  if (currentLat === null || currentLon === null) {
    alert("Start location first and wait for GPS coordinates.");
    return;
  }

  const url =
    "https://www.openstreetmap.org/?mlat=" +
    currentLat + "&mlon=" + currentLon +
    "#map=17/" + currentLat + "/" + currentLon;

  window.open(url, "_blank");
}
</script>
</body>
  </html>
