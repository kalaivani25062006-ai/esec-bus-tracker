
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESEC Bus Live GPS Tracker</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f6fd;
  color: #17365c;
  margin: 0;
  padding: 15px;
}

.card {
  background: white;
  max-width: 650px;
  margin: 15px auto;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 4px 16px #0001;
}

h2 {
  color: #176bd1;
  margin-top: 5px;
}

.info {
  background: #f1f6fd;
  padding: 12px;
  border-radius: 9px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#map {
  height: 380px;
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  border: 1px solid #d5dfed;
  background: #e5eaf0;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: #16834b;
  color: white;
}

.stop {
  background: #e5485d;
  color: white;
}

#message {
  line-height: 1.5;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="card">
  <h2>🚌 ESEC Bus Live GPS Tracker</h2>
  <p>Live mobile location on map</p>

  <div class="info">
    <b>Status:</b>
    <span id="status">NOT STARTED</span>
  </div>

  <div class="info">
    <b>Latitude:</b>
    <span id="lat">--</span>
  </div>

  <div class="info">
    <b>Longitude:</b>
    <span id="lon">--</span>
  </div>

  <div class="info">
    <b>GPS Accuracy:</b>
    <span id="accuracy">--</span>
  </div>

  <div id="map"></div>

  <button class="start" onclick="startGPS()">
    START LOCATION
  </button>

  <button class="stop" onclick="stopGPS()">
    STOP LOCATION
  </button>

  <p id="message">
    Press START LOCATION and allow location permission.
  </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let watchId = null;
let marker = null;
let accuracyCircle = null;
let currentLat = null;
let currentLon = null;

const statusText = document.getElementById("status");
const latText = document.getElementById("lat");
const lonText = document.getElementById("lon");
const accuracyText = document.getElementById("accuracy");
const messageText = document.getElementById("message");

// Create the map inside this website.
const map = L.map("map").setView([11.1965, 77.5827], 13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

function startGPS() {
  if (!window.isSecureContext) {
    messageText.textContent =
      "Please open this website using its HTTPS GitHub Pages link.";
    return;
  }

  if (!navigator.geolocation) {
    messageText.textContent =
      "Your browser does not support GPS location.";
    return;
  }

  if (watchId !== null) {
    messageText.textContent = "Location tracking is already active.";
    return;
  }

  statusText.textContent = "SEARCHING FOR LOCATION...";
  messageText.textContent =
    "Allow location permission and wait for GPS coordinates.";

  watchId = navigator.geolocation.watchPosition(
    function(position) {
      currentLat = position.coords.latitude;
      currentLon = position.coords.longitude;

      const point = [currentLat, currentLon];

      statusText.textContent = "LOCATION ACTIVE";
      latText.textContent = currentLat.toFixed(6);
      lonText.textContent = currentLon.toFixed(6);

      accuracyText.textContent =
        Math.round(position.coords.accuracy) + " metres";

      messageText.textContent =
        "Location updated at " +
        new Date().toLocaleTimeString();

      if (marker === null) {
        marker = L.marker(point)
          .addTo(map)
          .bindPopup("📍 Your current mobile location");

        marker.openPopup();
      } else {
        marker.setLatLng(point);
      }

      if (accuracyCircle === null) {
        accuracyCircle = L.circle(point, {
          radius: position.coords.accuracy
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(point);
        accuracyCircle.setRadius(position.coords.accuracy);
      }

      // Keep the map centered on the updated location.
      map.setView(point, 17);
    },

    function(error) {
      const messages = {
        1: "Location permission denied. Allow location in browser settings.",
        2: "Location unavailable. Check your phone GPS settings.",
        3: "GPS request timed out. Try again outdoors."
      };

      statusText.textContent = "LOCATION ERROR";
      messageText.textContent =
        messages[error.code] || error.message;

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    },

    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 25000
    }
  );
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  statusText.textContent = "LOCATION STOPPED";
  messageText.textContent = "GPS tracking stopped.";

  // Keep the last marker visible on the map.
}

// Fix map sizing when the page is first displayed.
setTimeout(function() {
  map.invalidateSize();
}, 300);
</script>
</body>
</html>
