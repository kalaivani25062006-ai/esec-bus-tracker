
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESEC Bus GPS Tracker</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f6fd;
  color: #17365c;
  padding: 15px;
  margin: 0;
}
.card {
  background: white;
  max-width: 600px;
  margin: 15px auto;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 4px 16px #0001;
}
h2 { color: #176bd1; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}
.start { background: #16834b; color: white; }
.stop { background: #e5485d; color: white; }
.info {
  background: #f1f6fd;
  padding: 12px;
  border-radius: 9px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
#map {
  height: 350px;
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>
<div class="card">
  <h2>🚌 ESEC Bus GPS Tracker</h2>
  <p>Live Mobile Location Tracking</p>

  <div class="info">
    <b>Status:</b> <span id="status">Not started</span>
  </div>
  <div class="info">
    <b>Latitude:</b> <span id="lat">--</span>
  </div>
  <div class="info">
    <b>Longitude:</b> <span id="lon">--</span>
  </div>
  <div class="info">
    <b>Accuracy:</b> <span id="accuracy">--</span>
  </div>

  <div id="map"></div>

  <button class="start" onclick="startGPS()">
    START LOCATION
  </button>
  <button class="stop" onclick="stopGPS()">
    STOP LOCATION
  </button>

  <p id="message">
    Press START LOCATION and allow location permission.
  </p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let watchId = null;
let marker = null;
let accuracyCircle = null;
let currentLat = null;
let currentLon = null;

const map = L.map('map').setView([11.0, 77.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('message').textContent =
      'Geolocation is not supported by this browser.';
    return;
  }

  if (watchId !== null) return;

  document.getElementById('status').textContent =
    'Searching for location...';

  document.getElementById('message').textContent =
    'Waiting for GPS coordinates...';

  watchId = navigator.geolocation.watchPosition(
    function(position) {
      currentLat = position.coords.latitude;
      currentLon = position.coords.longitude;

      const point = [currentLat, currentLon];

      document.getElementById('status').textContent =
        'LOCATION ACTIVE';

      document.getElementById('lat').textContent =
        currentLat.toFixed(6);

      document.getElementById('lon').textContent =
        currentLon.toFixed(6);

      document.getElementById('accuracy').textContent =
        Math.round(position.coords.accuracy) + ' metres';

      document.getElementById('message').textContent =
        'Live location updated: ' +
        new Date().toLocaleTimeString();

      if (marker === null) {
        marker = L.marker(point)
          .addTo(map)
          .bindPopup('Your current location')
          .openPopup();
      } else {
        marker.setLatLng(point);
      }

      if (accuracyCircle === null) {
        accuracyCircle = L.circle(point, {
          radius: position.coords.accuracy
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(point);
        accuracyCircle.setRadius(position.coords.accuracy);
      }

      map.setView(point, 17);
    },
    function(error) {
      document.getElementById('status').textContent =
        'Location unavailable';

      document.getElementById('message').textContent =
        error.message +
        '. Check location permission and phone GPS settings.';

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
    },
    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 20000
    }
  );
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  document.getElementById('status').textContent =
    'Location stopped';

  document.getElementById('message').textContent =
    'GPS tracking stopped.';
}
</script>
</body>
</html>
